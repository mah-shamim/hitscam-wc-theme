name: Release (tag + GitHub Release + zips)

on:
  push:
    branches: [main, master]
    paths: ['style.css', 'functions.php']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Resolve version and tag
        id: v
        run: |
          VER=$(grep -m1 '^Version:' style.css | awk '{print $2}')
          FN=$(grep -m1 "define( 'HITSCAM_VERSION'" functions.php | sed "s/.*'\([0-9.]*\)'.*/\1/")
          [ "$VER" = "$FN" ] || { echo "::error::style.css ($VER) != functions.php ($FN)"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            [ "${GITHUB_REF_NAME#v}" = "$VER" ] || { echo "::error::tag $GITHUB_REF_NAME != version $VER"; exit 1; }
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VER" >/dev/null 2>&1 && [[ "$GITHUB_REF" != refs/tags/v* ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build zips
        if: steps.v.outputs.exists == 'false'
        run: |
          VER=${{ steps.v.outputs.version }}
          mkdir -p dist build/hitscam
          rsync -a --exclude '/wp' --exclude '.git' --exclude '.github' --exclude 'dist' --exclude 'build' --exclude 'bundled-plugins/*/.git' ./ build/hitscam/
          (cd build && zip -qr ../dist/hitscam-wc-theme-v$VER.zip hitscam)
          for p in bundled-plugins/*/; do n=$(basename "$p"); (cd bundled-plugins && zip -qr ../dist/$n-v$VER.zip "$n"); done
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && ls -l)
      - name: Create tag + GitHub Release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: HitsCam v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
